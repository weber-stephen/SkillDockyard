project_id = "skill-dockyard-tests"

[auth]
site_url = "http://127.0.0.1:4319"
additional_redirect_urls = ["http://127.0.0.1:4319/auth/confirm", "http://localhost:4319/auth/confirm"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = true
max_frequency = "1s"

[inbucket]
admin_email = "noreply@skilldockyard.test"
sender_name = "Skill Dockyard Test"

[auth.email.template.confirmation]
subject = "Confirm your Skill Dockyard account"
content = "<h2>Confirm your email address</h2><p><a href=\"{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app\">Confirm email address</a></p>"
