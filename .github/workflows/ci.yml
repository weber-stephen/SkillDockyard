name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx supabase start
      - run: npx supabase db reset --yes
      - run: npm run test:db
      - name: Run local Supabase acceptance tests
        run: |
          set -a
          source <(npx supabase status --output env)
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" "$API_URL/rest/v1/workspaces?select=id&limit=1" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "PostgREST did not expose the migrated schema in time." >&2
              exit 1
            fi
            sleep 2
          done
          npm run test:acceptance
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated browser acceptance tests
        run: npm run test:browser:acceptance
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
      - run: npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-acceptance-report
            test-results
          if-no-files-found: ignore
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run cli:build
      - run: npm pack --dry-run
