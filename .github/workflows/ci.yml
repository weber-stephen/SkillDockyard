name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run cli:build
      - run: npm pack --dry-run
      - name: Upload fast browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-browser-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run local Supabase acceptance gate
        run: npm run test:acceptance
      - name: Collect Supabase and Mailpit diagnostics
        if: failure()
        run: |
          mkdir -p acceptance-diagnostics
          npx supabase status --output env > acceptance-diagnostics/supabase-status.env || true
          docker ps -a > acceptance-diagnostics/docker-ps.txt || true
          while read -r container_id; do docker logs "$container_id" > "acceptance-diagnostics/${container_id}.log" 2>&1 || true; done < <(docker ps -aq --filter "name=supabase")
          set -a
          source <(npx supabase status --output env) || true
          set +a
          curl --fail --silent --show-error "${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}/api/v1/messages" > acceptance-diagnostics/mailpit-messages.json || true
      - name: Upload acceptance artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: |
            playwright-report
            test-results
            acceptance-diagnostics
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  verify:
    if: ${{ always() }}
    needs: [fast, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every merge gate to succeed
        run: |
          if [ "${{ needs.fast.result }}" != "success" ] || [ "${{ needs.acceptance.result }}" != "success" ]; then
            echo "fast=${{ needs.fast.result }} acceptance=${{ needs.acceptance.result }}" >&2
            exit 1
          fi
